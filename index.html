<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Socratic Debate: Change the Bully with Love!</title>
  
  <!-- MediaPipe Hands API -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0c0f1d; color: #e2e8f0; min-height: 100vh; padding: 12px; display: flex; flex-direction: column; align-items: center; }

    #app-container { width: 100%; max-width: 950px; display: flex; flex-direction: column; gap: 10px; }

    #arena-header {
      background: #151c2e; border: 2px solid #2e3b5e; border-radius: 12px; padding: 12px 20px;
      display: flex; justify-content: space-between; align-items: center; font-size: 19px; font-weight: bold;
    }
    .p1-color { color: #38bdf8; }
    .p2-color { color: #f43f5e; }
    .timer-badge { color: #f59e0b; font-size: 22px; font-weight: bold; }

    /* Topic Prompt & Bilingual Banner */
    #prompt-banner {
      background: #1e293b; border: 2px solid #ec4899; border-radius: 10px; padding: 12px 18px;
      text-align: center; font-size: 18px; color: #f8fafc; font-weight: 600; line-height: 1.4;
      box-shadow: 0 4px 15px rgba(236,72,153,0.3);
    }
    #prompt-zh { font-size: 16px; color: #38bdf8; margin-top: 4px; font-weight: 500; }
    #prompt-hint { font-size: 14px; color: #f59e0b; margin-top: 4px; font-weight: normal; }

    /* Visual Options Box */
    #options-container {
      display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 8px;
    }
    .option-chip {
      background: #0f172a; border: 1px dashed #ec4899; color: #cbd5e1; padding: 6px 12px;
      border-radius: 20px; font-size: 13px; font-weight: 600;
    }

    /* Stage Area */
    #battle-stage {
      position: relative; width: 100%; height: 260px; background: #070913; border: 2px solid #2e3b5e;
      border-radius: 12px; overflow: hidden; display: flex; justify-content: space-between; align-items: center; padding: 0 40px;
    }
    .fighter { width: 80px; height: 80px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 36px; z-index: 2; }
    #player1-sprite { background: #0284c7; box-shadow: 0 0 20px #38bdf8; }
    #player2-sprite { background: #be123c; box-shadow: 0 0 20px #f43f5e; }
    
    /* Bully Container & CSS Spritesheet Animation */
    #monster-container {
      position: absolute; 
      left: calc(50% - 70px); 
      top: 15px; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      z-index: 1;
    }
    #monster-sprite {
      width: 140px; 
      height: 180px; 
      border-radius: 12px;
      background: url('https://raw.githubusercontent.com/junglin0916/debate-battle/main/bully_anime.jpg') no-repeat;
      background-size: 280px 540px;
      box-shadow: 0 0 15px rgba(236, 72, 153, 0.4);
      animation: animeCycle 6s steps(1) infinite;
      transition: transform 0.2s, filter 0.2s;
    }

    @keyframes animeCycle {
      0%    { background-position: 0px 0px; }
      16.6% { background-position: -140px 0px; }
      33.3% { background-position: 0px -180px; }
      50%   { background-position: -140px -180px; }
      66.6% { background-position: 0px -360px; }
      83.3% { background-position: -140px -360px; }
    }

    #heart-gauge-bar {
      width: 140px; height: 14px; background: #1e293b; border: 2px solid #ec4899; border-radius: 10px; overflow: hidden; margin-top: 6px;
    }
    #heart-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #ec4899, #f43f5e); transition: width 0.4s ease-in-out; }

    .heart-hit-effect {
      animation: pulse-heart 0.4s ease-in-out, animeCycle 6s steps(1) infinite;
      filter: brightness(1.6) drop-shadow(0 0 25px #ec4899) !important;
    }
    @keyframes pulse-heart { 0% { transform: scale(1); } 50% { transform: scale(1.12); } 100% { transform: scale(1); } }

    .arrow-of-love {
      position: absolute; font-size: 28px; top: 165px; transition: left 0.45s cubic-bezier(0.25, 1, 0.5, 1); z-index: 3;
    }

    #chat-box {
      height: 180px; background: #151c2e; border: 2px solid #2e3b5e; border-radius: 12px;
      padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
    }
    .msg { padding: 10px 14px; border-radius: 8px; font-size: 16px; max-width: 85%; line-height: 1.4; }
    .p1-msg { background: #0369a1; color: #fff; align-self: flex-start; }
    .p2-msg { background: #9f1239; color: #fff; align-self: flex-end; }
    .tutor-msg { background: #1e293b; color: #38bdf8; border: 1px solid #38bdf8; align-self: center; font-weight: bold; text-align: center; width: 92%; }

    #control-panel {
      background: #151c2e; border: 2px solid #2e3b5e; border-radius: 12px; padding: 12px;
      display: flex; gap: 10px; align-items: center;
    }
    #user-input { flex: 1; padding: 12px 16px; font-size: 17px; border-radius: 8px; border: 2px solid #475569; background: #0c0f1d; color: #fff; outline: none; }
    #user-input:focus { border-color: #ec4899; }
    
    .btn { padding: 12px 18px; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; transition: 0.2s; }
    .btn-p1 { background: #0284c7; color: #fff; }
    .btn-p2 { background: #be123c; color: #fff; }
    
    #cam-container { position: relative; width: 110px; height: 80px; border-radius: 6px; overflow: hidden; border: 2px solid #ec4899; background: #000; }
    #webcam { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    #gesture-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); }
    #motion-status {
      position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.8);
      color: #ec4899; font-size: 10px; text-align: center; font-weight: bold; padding: 2px 0;
    }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(12, 15, 29, 0.95);
      display: flex; justify-content: center; align-items: center; z-index: 100;
    }
    .form-box { background: #151c2e; border: 2px solid #ec4899; border-radius: 12px; padding: 24px; text-align: center; width: 90%; max-width: 550px; }
    .form-box h2 { color: #ec4899; font-size: 24px; margin-bottom: 6px; }
    .form-group { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
    .input-field { padding: 10px; font-size: 15px; border: 1px solid #475569; background: #0c0f1d; color: #fff; border-radius: 8px; text-align: center; }
    
    #leaderboard-box {
      width: 100%; margin: 10px 0; background: #0c0f1d; border: 1px solid #2e3b5e; border-radius: 8px; max-height: 180px; overflow-y: auto;
    }
    table { width: 100%; border-collapse: collapse; font-size: 14px; text-align: center; }
    th { background: #1e293b; color: #ec4899; padding: 8px; border-bottom: 1px solid #2e3b5e; position: sticky; top: 0; }
    td { padding: 6px; border-bottom: 1px solid #1e293b; color: #e2e8f0; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<!-- Startup Screen: Displays Leaderboard FIRST, then Student Registration -->
<div id="registration-modal" class="modal-overlay">
  <div class="form-box">
    <h2>💖 CHANGE THE BULLY WITH LOVE!</h2>
    
    <!-- Top Historical Leaderboard -->
    <h3 style="color:#38bdf8; font-size:15px; margin-top:6px;">🏆 Previous Scores Leaderboard</h3>
    <div id="start-leaderboard-container"></div>

    <p style="font-size:13px; color:#cbd5e1; margin-top:10px;">Enter student details to start the 2-minute Socratic Debate:</p>
    <div class="form-group">
      <input type="text" id="p1-input-name" class="input-field" placeholder="Player 1 Name" required>
      <input type="text" id="p2-input-name" class="input-field" placeholder="Player 2 Name" required>
      <input type="text" id="class-input" class="input-field" placeholder="Class (e.g. 701)">
    </div>

    <button class="btn btn-p1" style="width: 100%; margin-top:6px;" onclick="startBattleSession()">START 2-MIN MISSION</button>
  </div>
</div>

<div id="app-container">
  <div id="arena-header">
    <div class="p1-color"><span id="p1-name-display">P1</span> Love: <span id="p1-score">0</span></div>
    <div class="timer-badge">⏰ <span id="timer-val">02:00</span></div>
    <div class="p2-color"><span id="p2-name-display">P2</span> Love: <span id="p2-score">0</span></div>
  </div>

  <div id="prompt-banner">
    <div id="prompt-text">Loading scene...</div>
    <div id="prompt-zh">載入中...</div>
    <div id="options-container"></div>
    <div id="prompt-hint">💡 Hint: Choose your response carefully!</div>
  </div>

  <div id="battle-stage">
    <div id="player1-sprite" class="fighter">🧙‍♂️</div>
    <div id="monster-container">
      <div id="monster-sprite"></div>
      <div id="heart-gauge-bar"><div id="heart-fill"></div></div>
    </div>
    <div id="player2-sprite" class="fighter">🥷</div>
  </div>

  <div id="chat-box"></div>

  <div id="control-panel">
    <div id="cam-container">
      <video id="webcam" autoplay playsinline muted></video>
      <canvas id="gesture-canvas"></canvas>
      <div id="motion-status">AI CAM READY</div>
    </div>
    <input type="text" id="user-input" placeholder="Press 🎤 to speak your choice..." autocomplete="off">
    <button id="mic-btn" class="btn btn-p1" onclick="toggleMic()">🎤 SPEAK</button>
    <button id="send-btn" class="btn btn-p1" onclick="submitSpeech()">SEND</button>
  </div>
</div>

<script>
  const LEADERBOARD_URL = "https://script.google.com/macros/s/AKfycbwnG3Mc1jpxrASeMr9FRjBS0a9r8bKOmMDPdzLFsn4UszeuMzAkJDu6yBHd68O4d6MAxw/exec";

  const INAPPROPRIATE_WORDS = ["shut up", "stupid", "idiot", "die", "ugly", "hate", "fight", "kill", "dumb", "fool", "loser", "hate you"];

  const QUESTION_BANK = [
    {
      prompt: "📢 Scenario 1: The bully cuts in front of lunch line!",
      promptZh: "情境一：霸凌者在午餐排隊時插隊！你該怎麼辦？",
      spokenIntro: "Scenario one. The bully cuts in line! Choose your response.",
      pool: [
        "Please don't cut in line.",
        "Please wait in line.",
        "Don't cut in line, please.",
        "Please go to the back of the line.",
        "Be polite and wait in line."
      ]
    },
    {
      prompt: "📢 Scenario 2: The bully looks lonely during lunchtime.",
      promptZh: "情境二：霸凌者在午餐時間看起來很孤單。",
      spokenIntro: "Scenario two. The bully looks lonely. Invite them!",
      pool: [
        "Let's eat lunch together!",
        "Let's be friends!",
        "Let's eat bento together!",
        "Let me share my food with you!",
        "Let's sit together at lunch!"
      ]
    },
    {
      prompt: "📢 Scenario 3: The bully drops trash in the hallway.",
      promptZh: "情境三：霸凌者在走廊亂丟垃圾。",
      spokenIntro: "Scenario three. The bully litters in the hallway.",
      pool: [
        "Please pick up the trash.",
        "Don't litter, please.",
        "Clean it up, please.",
        "Please put the trash in the bin.",
        "Keep our school clean, please."
      ]
    },
    {
      prompt: "📢 Scenario 4: The bully pushes classmates in PE class.",
      promptZh: "情境四：霸凌者在體育課時推同學。",
      spokenIntro: "Scenario four. The bully pushes classmates in PE class.",
      pool: [
        "Be careful, please!",
        "Please don't push!",
        "Don't push others, please!",
        "Play safely, please!",
        "Stop pushing and be careful!"
      ]
    },
    {
      prompt: "📢 Scenario 5: The bully plays smartphone games during class!",
      promptZh: "情境五：霸凌者在上課時間偷玩手機遊戲！",
      spokenIntro: "Scenario five. The bully plays games during class!",
      pool: [
        "Please turn off your phone.",
        "Don't play games in class!",
        "Listen to the teacher, please.",
        "Put your phone away, please.",
        "Pay attention in class, please."
      ]
    }
  ];

  let activeScenarios = [];
  let p1Name = "Player 1", p2Name = "Player 2", className = "-";
  let activePlayer = 1;
  let p1Score = 0, p2Score = 0;
  let totalLoveMeter = 0;
  let currentPromptIdx = 0;
  let currentAwardPoints = 0;
  let canShoot = false;
  let recognition = null;
  let isMicActive = false;
  let hands = null;

  let timeLeft = 120;
  let gameTimerInterval = null;

  const chatBox = document.getElementById("chat-box");
  const userInput = document.getElementById("user-input");
  const micBtn = document.getElementById("mic-btn");
  const sendBtn = document.getElementById("send-btn");
  const video = document.getElementById("webcam");
  const motionStatus = document.getElementById("motion-status");

  function renderLeaderboardTable() {
    let scores = JSON.parse(localStorage.getItem("debate_battle_scores") || "[]");
    if (scores.length === 0) {
      return `<p style="font-size:12px; color:#94a3b8; margin:6px 0;">No previous records yet. Start the first session!</p>`;
    }
    let rowsHtml = scores.slice(0, 5).map((s, idx) => `
      <tr>
        <td style="color:#f59e0b; font-weight:bold;">#${idx + 1}</td>
        <td><b>${s.name}</b></td>
        <td>${s.className}</td>
        <td style="color:#ec4899; font-weight:bold;">⭐ ${s.score}</td>
      </tr>
    `).join("");

    return `
      <div id="leaderboard-box">
        <table>
          <thead>
            <tr><th>Rank</th><th>Name</th><th>Class</th><th>Love Points</th></tr>
          </thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>
    `;
  }

  function buildRandomizedScenarios() {
    activeScenarios = QUESTION_BANK.map(scen => {
      let shuffled = [...scen.pool].sort(() => 0.5 - Math.random());
      let selected = shuffled.slice(0, 3);
      
      let options = selected.map(text => {
        let randomPoints = Math.floor(Math.random() * 4) * 5 + 25;
        return { text: text, points: randomPoints, desc: `+${randomPoints} pts` };
      });

      return {
        prompt: scen.prompt,
        promptZh: scen.promptZh,
        spokenIntro: scen.spokenIntro,
        options: options
      };
    });
  }

  function speakTutor(text) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.88;
    window.speechSynthesis.speak(u);
  }

  if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.continuous = false;

    recognition.onstart = () => {
      isMicActive = true;
      micBtn.textContent = "🎙️ LISTENING...";
      micBtn.style.background = "#ef4444";
    };

    recognition.onresult = (e) => {
      userInput.value = e.results[0][0].transcript;
      submitSpeech();
    };

    recognition.onerror = recognition.onend = () => {
      isMicActive = false;
      micBtn.textContent = "🎤 SPEAK";
      micBtn.style.background = activePlayer === 1 ? "#0284c7" : "#be123c";
    };
  }

  function toggleMic() {
    if (!recognition) return;
    if (isMicActive) recognition.stop();
    else recognition.start();
  }

  function updatePromptUI() {
    const scenario = activeScenarios[currentPromptIdx];
    document.getElementById("prompt-text").textContent = scenario.prompt;
    document.getElementById("prompt-zh").textContent = scenario.promptZh;
    
    const optsBox = document.getElementById("options-container");
    optsBox.innerHTML = "";
    scenario.options.forEach(opt => {
      const chip = document.createElement("span");
      chip.className = "option-chip";
      chip.textContent = `💬 "${opt.text}" (${opt.desc})`;
      optsBox.appendChild(chip);
    });

    speakTutor(scenario.spokenIntro);
  }

  function startBattleSession() {
    p1Name = document.getElementById("p1-input-name").value.trim() || "Player 1";
    p2Name = document.getElementById("p2-input-name").value.trim() || "Player 2";
    className = document.getElementById("class-input").value.trim() || "-";

    document.getElementById("p1-name-display").textContent = p1Name;
    document.getElementById("p2-name-display").textContent = p2Name;
    document.getElementById("registration-modal").classList.add("hidden");

    buildRandomizedScenarios();
    appendTutorMsg(`👋 Welcome ${p1Name} and ${p2Name}! Speak polite English to change the bully!`);
    
    setTimeout(() => {
      updatePromptUI();
      initMediaPipeHands();
      start2MinTimer();
    }, 1200);
  }

  function start2MinTimer() {
    clearInterval(gameTimerInterval);
    gameTimerInterval = setInterval(() => {
      timeLeft--;
      let m = Math.floor(timeLeft / 60), s = timeLeft % 60;
      document.getElementById("timer-val").textContent = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
      
      if (timeLeft <= 0) {
        clearInterval(gameTimerInterval);
        finishBattle("TIME EXPIRED");
      }
    }, 1000);
  }

  function appendTutorMsg(text) {
    const div = document.createElement("div");
    div.className = "msg tutor-msg";
    div.textContent = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function appendMsg(sender, text) {
    const div = document.createElement("div");
    div.className = "msg " + (sender === 1 ? "p1-msg" : "p2-msg");
    div.textContent = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function submitSpeech() {
    const text = userInput.value.trim();
    if (!text || timeLeft <= 0) return;

    const currentName = activePlayer === 1 ? p1Name : p2Name;
    const lower = text.toLowerCase();

    const isToxic = INAPPROPRIATE_WORDS.some(badWord => lower.includes(badWord));
    if (isToxic) {
      appendMsg(activePlayer, `${currentName}: "${text}"`);
      userInput.value = "";
      appendTutorMsg(`🚫 Answer Rejected! Please do not use rude or harmful words. Try a polite response!`);
      speakTutor("Answer rejected. Please use polite language.");
      return;
    }

    const scenario = activeScenarios[currentPromptIdx];
    let matchedOption = null;

    for (let opt of scenario.options) {
      const optLower = opt.text.toLowerCase();
      const keyWords = optLower.replace(/[^\w\s]/gi, '').split(' ');
      const matchCount = keyWords.filter(w => w.length > 2 && lower.includes(w)).length;
      if (matchCount >= 2 || lower.includes(optLower)) {
        matchedOption = opt;
        break;
      }
    }

    appendMsg(activePlayer, `${currentName}: "${text}"`);
    userInput.value = "";

    if (matchedOption) {
      currentAwardPoints = matchedOption.points;
      appendTutorMsg(`🌟 Great choice! (${matchedOption.desc}). Show a THUMBS UP (👍) to fire the Arrow of Love!`);
      speakTutor(`Great choice! Show a thumbs up to fire!`);
      canShoot = true;
      motionStatus.textContent = "SHOW 👍 THUMBS UP";
      motionStatus.style.color = "#ec4899";
    } else {
      appendTutorMsg(`💡 Tutor: Try saying one of the polite options shown above!`);
      speakTutor("Please try saying one of the polite options.");
    }
  }

  function shootArrowOfLove() {
    if (!canShoot) return;
    canShoot = false;
    motionStatus.textContent = "💘 ARROW FIRED!";
    motionStatus.style.color = "#22c55e";

    const arrow = document.createElement("div");
    arrow.className = "arrow-of-love";
    arrow.textContent = "💘";
    const stage = document.getElementById("battle-stage");
    const monster = document.getElementById("monster-sprite");

    if (activePlayer === 1) {
      arrow.style.left = "120px";
      stage.appendChild(arrow);
      setTimeout(() => { arrow.style.left = "calc(50% - 20px)"; }, 40);
      p1Score += currentAwardPoints;
      document.getElementById("p1-score").textContent = p1Score;
    } else {
      arrow.style.left = "calc(100% - 140px)";
      stage.appendChild(arrow);
      setTimeout(() => { arrow.style.left = "calc(50% - 20px)"; }, 40);
      p2Score += currentAwardPoints;
      document.getElementById("p2-score").textContent = p2Score;
    }

    totalLoveMeter = Math.min(100, totalLoveMeter + 20);
    document.getElementById("heart-fill").style.width = totalLoveMeter + "%";

    setTimeout(() => {
      monster.classList.add("heart-hit-effect");
      setTimeout(() => monster.classList.remove("heart-hit-effect"), 450);
    }, 380);

    setTimeout(() => {
      arrow.remove();

      if (totalLoveMeter >= 100) {
        finishBattle("BULLY CHANGED INTO A FRIEND!");
        return;
      }

      activePlayer = activePlayer === 1 ? 2 : 1;
      currentPromptIdx = (currentPromptIdx + 1) % activeScenarios.length;
      updatePromptUI();

      const nextName = activePlayer === 1 ? p1Name : p2Name;
      userInput.placeholder = `${nextName}'s turn to speak...`;
      micBtn.className = `btn btn-p${activePlayer}`;
      sendBtn.className = `btn btn-p${activePlayer}`;
      motionStatus.textContent = "AI CAM READY";
      motionStatus.style.color = "#ec4899";
    }, 600);
  }

  function initMediaPipeHands() {
    hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });

    hands.onResults(onHandResults);

    const camera = new Camera(video, {
      onFrame: async () => {
        if (canShoot) {
          await hands.send({ image: video });
        }
      },
      width: 160,
      height: 120
    });
    camera.start();
  }

  function onHandResults(results) {
    if (!canShoot || !results.multiHandLandmarks || results.multiHandLandmarks.length === 0) return;

    const landmarks = results.multiHandLandmarks[0];
    const isThumbsUp = landmarks[4].y < landmarks[3].y && landmarks[3].y < landmarks[2].y && landmarks[8].y > landmarks[5].y;
    const isPointUp = landmarks[8].y < landmarks[6].y && landmarks[12].y > landmarks[10].y;

    if (isThumbsUp || isPointUp) {
      shootArrowOfLove();
    }
  }

  function saveAndRecordScores() {
    let scores = JSON.parse(localStorage.getItem("debate_battle_scores") || "[]");
    scores.push({ name: p1Name, className: className, score: p1Score, date: new Date().toLocaleDateString() });
    scores.push({ name: p2Name, className: className, score: p2Score, date: new Date().toLocaleDateString() });
    scores.sort((a, b) => b.score - a.score);
    localStorage.setItem("debate_battle_scores", JSON.stringify(scores));
  }

  async function finishBattle(reason) {
    clearInterval(gameTimerInterval);
    document.getElementById("control-panel").style.display = "none";

    let winner = "Both Players";
    if (p1Score > p2Score) winner = p1Name;
    else if (p2Score > p1Score) winner = p2Name;

    appendTutorMsg(`🎉 MISSION COMPLETE! ${winner.toUpperCase()} won the debate!`);
    speakTutor("Mission complete! The bully is now your friend!");

    saveAndRecordScores();
    const tableHtml = renderLeaderboardTable();

    const payloadP1 = { name: p1Name, className: className, seatNum: "P1", score: p1Score };
    const payloadP2 = { name: p2Name, className: className, seatNum: "P2", score: p2Score };

    try {
      await fetch(LEADERBOARD_URL, {
        method: "POST", mode: "no-cors",
        headers: { "Content-Type": "text/plain" }, body: JSON.stringify(payloadP1)
      });
      await fetch(LEADERBOARD_URL, {
        method: "POST", mode: "no-cors",
        headers: { "Content-Type": "text/plain" }, body: JSON.stringify(payloadP2)
      });
    } catch(e) {}

    const modal = document.createElement("div");
    modal.className = "modal-overlay";
    modal.innerHTML = `
      <div class="form-box">
        <h2>🏆 GAME OVER!</h2>
        <p style="color:#ec4899; font-size:17px; font-weight:bold;">${reason}</p>
        <p>Winner: <b>${winner}</b></p>
        <br>
        <h3 style="color:#38bdf8;">📊 Leaderboard (All Runs)</h3>
        ${tableHtml}
        <button class="btn btn-p1" style="width:100%; margin-top:10px;" onclick="window.location.reload()">PLAY AGAIN</button>
      </div>
    `;
    document.body.appendChild(modal);
  }

  // Load Leaderboard Table on startup screen
  document.getElementById("start-leaderboard-container").innerHTML = renderLeaderboardTable();

  userInput.addEventListener("keydown", (e) => { if (e.key === "Enter") submitSpeech(); });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2-Player English Debate & AI Gesture Battle</title>
  
  <!-- MediaPipe Hands & Camera Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0c0f1d; color: #e2e8f0; min-height: 100vh; padding: 12px; display: flex; flex-direction: column; align-items: center; }

    #app-container { width: 100%; max-width: 950px; display: flex; flex-direction: column; gap: 10px; }

    /* Top Arena Header */
    #arena-header {
      background: #151c2e; border: 2px solid #2e3b5e; border-radius: 12px; padding: 12px 20px;
      display: flex; justify-content: space-between; align-items: center; font-size: 20px; font-weight: bold;
    }
    .p1-color { color: #38bdf8; }
    .p2-color { color: #f43f5e; }
    .vs-badge { color: #f59e0b; font-size: 22px; }

    /* Battle Visual Stage */
    #battle-stage {
      position: relative; width: 100%; height: 280px; background: #070913; border: 2px solid #2e3b5e;
      border-radius: 12px; overflow: hidden; display: flex; justify-content: space-between; align-items: center; padding: 0 40px;
    }
    .fighter { width: 90px; height: 90px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 40px; z-index: 2; }
    #player1-sprite { background: #0284c7; box-shadow: 0 0 20px #38bdf8; }
    #player2-sprite { background: #be123c; box-shadow: 0 0 20px #f43f5e; }
    
    /* GIF Monster Integration */
    #monster-sprite {
      width: 140px; height: 140px; object-fit: contain; position: absolute; left: calc(50% - 70px); top: 50px;
      filter: drop-shadow(0 0 15px #f59e0b); z-index: 1; transition: transform 0.2s, filter 0.2s;
    }

    .hit-effect {
      animation: shake 0.3s ease-in-out;
      filter: brightness(2) drop-shadow(0 0 25px #ef4444) !important;
    }
    @keyframes shake {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-10px, 0); }
      75% { transform: translate(10px, 0); }
      100% { transform: translate(0, 0); }
    }

    /* Bullet Animation */
    .bullet {
      position: absolute; width: 30px; height: 10px; border-radius: 5px; background: #f59e0b;
      box-shadow: 0 0 14px #f59e0b; top: 190px; transition: left 0.4s linear; z-index: 3;
    }

    /* Dialogue Log */
    #chat-box {
      height: 200px; background: #151c2e; border: 2px solid #2e3b5e; border-radius: 12px;
      padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
    }
    .msg { padding: 12px 16px; border-radius: 8px; font-size: 18px; max-width: 82%; line-height: 1.4; }
    .p1-msg { background: #0369a1; color: #fff; align-self: flex-start; }
    .p2-msg { background: #9f1239; color: #fff; align-self: flex-end; }
    .sys-msg { background: #1e293b; color: #f59e0b; align-self: center; font-weight: bold; text-align: center; width: 90%; }

    /* Control Panel & Gesture Monitor */
    #control-panel {
      background: #151c2e; border: 2px solid #2e3b5e; border-radius: 12px; padding: 14px;
      display: flex; gap: 12px; align-items: center;
    }
    #user-input { flex: 1; padding: 12px 16px; font-size: 18px; border-radius: 8px; border: 2px solid #475569; background: #0c0f1d; color: #fff; outline: none; }
    #user-input:focus { border-color: #38bdf8; }
    
    .btn { padding: 12px 20px; font-size: 18px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; transition: 0.2s; }
    .btn-p1 { background: #0284c7; color: #fff; }
    .btn-p2 { background: #be123c; color: #fff; }
    
    #cam-container { position: relative; width: 130px; height: 90px; border-radius: 6px; overflow: hidden; border: 2px solid #38bdf8; background: #000; }
    #webcam { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    #gesture-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); }
    #motion-status {
      position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.8);
      color: #38bdf8; font-size: 10px; text-align: center; font-weight: bold; padding: 2px 0;
    }

    /* Modal */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(12, 15, 29, 0.95);
      display: flex; justify-content: center; align-items: center; z-index: 100;
    }
    .form-box { background: #151c2e; border: 2px solid #38bdf8; border-radius: 12px; padding: 28px; text-align: center; width: 90%; max-width: 500px; }
    .form-box h2 { color: #38bdf8; font-size: 26px; margin-bottom: 14px; }
    .form-group { display: flex; flex-direction: column; gap: 10px; margin: 16px 0; }
    .input-field { padding: 12px; font-size: 16px; border: 1px solid #475569; background: #0c0f1d; color: #fff; border-radius: 8px; text-align: center; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div id="registration-modal" class="modal-overlay">
  <div class="form-box">
    <h2>⚔️ 2-PLAYER DEBATE BATTLE</h2>
    <p>Enter player details to start:</p>
    <div class="form-group">
      <input type="text" id="p1-input-name" class="input-field" placeholder="Player 1 Name" required>
      <input type="text" id="p2-input-name" class="input-field" placeholder="Player 2 Name" required>
      <input type="text" id="class-input" class="input-field" placeholder="Class (e.g. 701)">
    </div>
    <button class="btn btn-p1" style="width: 100%;" onclick="startBattleSession()">START BATTLE</button>
  </div>
</div>

<div id="app-container">
  <div id="arena-header">
    <div class="p1-color"><span id="p1-name-display">P1</span> (HP: <span id="p1-hp">100</span>)</div>
    <div class="vs-badge">⚔️ DEBATE DUET ⚔️</div>
    <div class="p2-color"><span id="p2-name-display">P2</span> (HP: <span id="p2-hp">100</span>)</div>
  </div>

  <div id="battle-stage">
    <div id="player1-sprite" class="fighter">🧙‍♂️</div>
    <img id="monster-sprite" src="https://raw.githubusercontent.com/junglin0916/debate-battle/main/bully_monster_idle.gif" alt="Bully Monster">
    <div id="player2-sprite" class="fighter">🥷</div>
  </div>

  <div id="chat-box"></div>

  <div id="control-panel">
    <div id="cam-container">
      <video id="webcam" autoplay playsinline muted></video>
      <canvas id="gesture-canvas"></canvas>
      <div id="motion-status">AI CAM READY</div>
    </div>
    <input type="text" id="user-input" placeholder="Player 1's turn to speak English..." autocomplete="off">
    <button id="mic-btn" class="btn btn-p1" onclick="toggleMic()">🎤 SPEAK</button>
    <button id="send-btn" class="btn btn-p1" onclick="submitSpeech()">SEND</button>
  </div>
</div>

<script>
  const LEADERBOARD_URL = "https://script.google.com/macros/s/AKfycbwnG3Mc1jpxrASeMr9FRjBS0a9r8bKOmMDPdzLFsn4UszeuMzAkJDu6yBHd68O4d6MAxw/exec";

  let p1Name = "Player 1", p2Name = "Player 2", className = "-";
  let activePlayer = 1;
  let p1Hp = 100, p2Hp = 100;
  let p1Score = 0, p2Score = 0;
  let canShoot = false;
  let recognition = null;
  let hands = null;

  const chatBox = document.getElementById("chat-box");
  const userInput = document.getElementById("user-input");
  const micBtn = document.getElementById("mic-btn");
  const sendBtn = document.getElementById("send-btn");
  const video = document.getElementById("webcam");
  const motionStatus = document.getElementById("motion-status");

  // Web Speech Setup
  if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.lang = 'en-US';

    recognition.onstart = () => { micBtn.textContent = "🎙️ LISTENING..."; };
    recognition.onresult = (e) => {
      userInput.value = e.results[0][0].transcript;
      submitSpeech();
    };
    recognition.onerror = recognition.onend = () => { micBtn.textContent = "🎤 SPEAK"; };
  }

  function toggleMic() {
    if (recognition) recognition.start();
  }

  function startBattleSession() {
    p1Name = document.getElementById("p1-input-name").value.trim() || "Player 1";
    p2Name = document.getElementById("p2-input-name").value.trim() || "Player 2";
    className = document.getElementById("class-input").value.trim() || "-";

    document.getElementById("p1-name-display").textContent = p1Name;
    document.getElementById("p2-name-display").textContent = p2Name;
    document.getElementById("registration-modal").classList.add("hidden");

    initMediaPipeHands();
    appendMsg(0, `⚔️ Battle Started! ${p1Name}, speak your sentence first!`);
  }

  function appendMsg(sender, text) {
    const div = document.createElement("div");
    div.className = "msg " + (sender === 1 ? "p1-msg" : sender === 2 ? "p2-msg" : "sys-msg");
    div.textContent = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function submitSpeech() {
    const text = userInput.value.trim();
    if (!text) return;

    const currentName = activePlayer === 1 ? p1Name : p2Name;
    appendMsg(activePlayer, `${currentName}: "${text}"`);
    userInput.value = "";

    if (text.length >= 2) {
      if (activePlayer === 1) p1Score += 25; else p2Score += 25;
      appendMsg(0, `🎯 Valid Sentence! 👍 SHOW A THUMBS UP OR POINT UP TO THE CAMERA TO SHOOT!`);
      canShoot = true;
      motionStatus.textContent = "SHOW 👍 THUMBS UP";
      motionStatus.style.color = "#f59e0b";
    } else {
      appendMsg(0, `⚠️ Say a complete sentence!`);
    }
  }

  function shootBullet() {
    if (!canShoot) return;
    canShoot = false;
    motionStatus.textContent = "👍 SHOT FIRED!";
    motionStatus.style.color = "#22c55e";

    const bullet = document.createElement("div");
    bullet.className = "bullet";
    const stage = document.getElementById("battle-stage");
    const monster = document.getElementById("monster-sprite");

    if (activePlayer === 1) {
      bullet.style.left = "130px";
      stage.appendChild(bullet);
      setTimeout(() => { bullet.style.left = "calc(100% - 150px)"; }, 40);
      p2Hp -= 25;
    } else {
      bullet.style.left = "calc(100% - 150px)";
      stage.appendChild(bullet);
      setTimeout(() => { bullet.style.left = "130px"; }, 40);
      p1Hp -= 25;
    }

    setTimeout(() => {
      monster.classList.add("hit-effect");
      setTimeout(() => monster.classList.remove("hit-effect"), 300);
    }, 200);

    setTimeout(() => {
      bullet.remove();
      document.getElementById("p1-hp").textContent = Math.max(0, p1Hp);
      document.getElementById("p2-hp").textContent = Math.max(0, p2Hp);

      if (p1Hp <= 0 || p2Hp <= 0) {
        finishBattle();
        return;
      }

      activePlayer = activePlayer === 1 ? 2 : 1;
      const nextName = activePlayer === 1 ? p1Name : p2Name;
      userInput.placeholder = `${nextName}'s turn to speak...`;
      micBtn.className = `btn btn-p${activePlayer}`;
      sendBtn.className = `btn btn-p${activePlayer}`;
      appendMsg(0, `🔄 Turn switched! ${nextName}, speak your sentence!`);
      motionStatus.textContent = "AI CAM READY";
      motionStatus.style.color = "#38bdf8";
    }, 500);
  }

  // AI MediaPipe Hand Tracking Setup
  function initMediaPipeHands() {
    hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });

    hands.onResults(onHandResults);

    const camera = new Camera(video, {
      onFrame: async () => {
        if (canShoot) {
          await hands.send({ image: video });
        }
      },
      width: 160,
      height: 120
    });
    camera.start();
  }

  function onHandResults(results) {
    if (!canShoot || !results.multiHandLandmarks || results.multiHandLandmarks.length === 0) return;

    const landmarks = results.multiHandLandmarks[0];

    // Landmark 4: Thumb Tip, Landmark 3: Thumb IP, Landmark 8: Index Tip, Landmark 5: Index MCP
    const isThumbsUp = landmarks[4].y < landmarks[3].y && landmarks[3].y < landmarks[2].y && landmarks[8].y > landmarks[5].y;
    const isPointUp = landmarks[8].y < landmarks[6].y && landmarks[12].y > landmarks[10].y;

    if (isThumbsUp || isPointUp) {
      shootBullet();
    }
  }

  async function finishBattle() {
    const winner = p1Hp > p2Hp ? p1Name : p2Name;
    appendMsg(0, `🏆 GAME OVER! ${winner} WINS THE BATTLE!`);

    const payloadP1 = { name: p1Name, className: className, seatNum: "P1", score: p1Score };
    const payloadP2 = { name: p2Name, className: className, seatNum: "P2", score: p2Score };

    try {
      await fetch(LEADERBOARD_URL, {
        method: "POST", mode: "no-cors",
        headers: { "Content-Type": "text/plain" }, body: JSON.stringify(payloadP1)
      });
      await fetch(LEADERBOARD_URL, {
        method: "POST", mode: "no-cors",
        headers: { "Content-Type": "text/plain" }, body: JSON.stringify(payloadP2)
      });
      appendMsg(0, `📊 Scores saved to Leaderboard!`);
    } catch(e) {}
  }

  userInput.addEventListener("keydown", (e) => { if (e.key === "Enter") submitSpeech(); });
</script>
</body>
</html>
